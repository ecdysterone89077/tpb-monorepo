name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build contracts + API
        run: |
          pnpm --filter @tpb/contracts build
          pnpm --filter @tpb/api prisma:generate
          pnpm --filter @tpb/api build

      - name: Build web (staging API URL)
        run: pnpm --filter @tpb/web build
        env:
          VITE_API_URL: ${{ vars.STAGING_API_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tpb-staging-${{ github.sha }}
          path: |
            apps/api/dist
            apps/api/prisma
            apps/api/node_modules/.prisma
            apps/web/dist
            packages/contracts/dist
            ecosystem.config.cjs
            Dockerfile
          retention-days: 5

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin develop
            git checkout --force develop
            git reset --hard origin/develop
            pnpm install --frozen-lockfile
            pnpm --filter @tpb/api prisma:deploy
            pnpm --filter @tpb/contracts build
            pnpm --filter @tpb/api build
            VITE_API_URL="${{ vars.STAGING_API_URL }}" pnpm --filter @tpb/web build
            (pm2 reload ecosystem.config.cjs --only tpb-api --env production --update-env || pm2 start ecosystem.config.cjs --env production)
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:3000/v1/health
